<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/styles.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>



</head>
<body>
  <div id="smooth-wrapper">
    <div id="smooth-content">

      <nav class="navbar navbar-expand-lg custom-navbar {% if request.endpoint == 'home' %}whiteNav{% endif %}">
        <div class="container-fluid">
          <!-- Logo -->
          <a class="navbar-brand text-uppercase fw-bold" href="/" id="logo">
            ANTONIO JEFFERSON<span class="d-block small">STUDIO</span>
          </a>

          <!-- Hamburger -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Nav Items -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-5">
              <li class="nav-item">
                <a class="bookNav nav-link {% if request.endpoint == 'book' %}active{% endif %}" href="{{ url_for('book') }}">Book Now</a>
              </li>
              <li class="nav-item">
                <a class="studioNav nav-link {% if request.endpoint == 'studio' %}active{% endif %}" href="{{ url_for('studio') }}">Studio</a>
              </li>
              <li class="nav-item">
                <a class="contactNav nav-link {% if request.endpoint == 'contact' %}active{% endif %}" href="{{ url_for('contact') }}">Contact</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="https://www.instagram.com/antoniojeffersonstudio/?hl=en"><i style="font-size: 22px;"class="bi bi-instagram"></i></a>
              </li>
              <li class="nav-item">
                <a class="donateBtn btn nav-link" href="https://www.paypal.com/donate/?hosted_button_id=3XCLBVN7KEYFG">Donate Now</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>


      <main>
          {% block content %}{% endblock %}
          <footer>
                {% block footer %}
            <div class="default-footer" id="logo">
                <h1>ANTONIO JEFFERSON</h1>
                <h2>STUDIO</h2>
            </div>
            <div id="info">
                <ul>
                    <li>53 Bridge St. #707<br>Brooklyn, NY</li>
                    <li>PHONE: (917)·215·5100</li>
                    <li><a href="mailto:info@antoniojefferson.com">info@antoniojefferson.com</a></li>
                    <li>
                        <a href="https://www.instagram.com/antoniojeffersonstudio/?hl=en"><i class="bi bi-instagram"></i></a>
                    </li>
                </ul>
            </div>
            {% endblock %}
          </footer>
      </main>
      

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
