<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/styles.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body>
  <div id="smooth-wrapper">
    <div id="smooth-content">

      <nav class="navbar navbar-expand-lg navbar-dark py-1 custom-navbar">
        <div class="container-fluid">
          <!-- Logo -->
          <a class="navbar-brand text-uppercase fw-bold" href="/" id="logo">
            ANTONIO JEFFERSON<span class="d-block small">STUDIO</span>
          </a>

          <!-- Hamburger -->
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Nav Items -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-4 text-uppercase fw-semibold">
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'book' %}active{% endif %}" href="{{ url_for('book') }}">Book</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'services' %}active{% endif %}" href="{{ url_for('services') }}">Services</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'shop' %}active{% endif %}" href="{{ url_for('shop') }}">Shop</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'studio' %}active{% endif %}" href="{{ url_for('studio') }}">Studio</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>


      <main>
          {% block content %}{% endblock %}
          <footer>
                {% block footer %}
            <div class="default-footer" id="logo">
                <h1>ANTONIO JEFFERSON</h1>
                <h2>STUDIO</h2>
            </div>
            <div id="info">
                <ul>
                    <li>New York City</li>
                    <li>53 Bridge St. #707<br>Brooklyn, NY</li>
                    <li>PHONE: 000-000-0000</li>
                    <li>INFO@AJSTUDIOS.COM</li>
                    <li>
                        <i class="bi bi-instagram"></i>
                        <i class="bi bi-linkedin"></i>
                    </li>
                </ul>
            </div>
            {% endblock %}
          </footer>
      </main>
      

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
